name: Stage 3 validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-l3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix l3-audit --ignore-scripts --no-fund
      - run: npm test --prefix l3-audit
      - run: az bicep build --file infra/optional-l3/main.bicep --stdout >/dev/null
  customer-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install configuration parser
        run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1 service-identity==24.2.0 'psycopg[binary]==3.2.10' azure-identity==1.25.1 azure-keyvault-secrets==4.10.0 websocket-client==1.9.2
      - name: Test customer migration gates
        run: |
          mkdir -p temp
          python -m unittest tests.test_customer_migration tests.test_public_config
          python -m unittest tests.test_migration_deploy tests.test_migration_evidence tests.test_migration_runtime tests.test_migration_workflows
          python -m unittest tests.test_availability_zones tests.test_app_gateway tests.test_certificate_pfx tests.test_limx_readiness
          python -m unittest tests.test_greenfield_runtime
          python -m unittest -b tests.test_delivery_paths tests.test_install_workflows tests.test_installation_readiness tests.test_runner_lifecycle tests.test_dns_runtime tests.test_gateway_checks
          python -m unittest -b tests.test_local_rehearsal tests.test_project_docs
          python -m unittest tests.test_private_ingress tests.test_private_ingress_runtime tests.test_private_ingress_probes tests.test_admin_allowlist tests.test_api_wss tests.test_responses_wss_probe
          python -m unittest tests.test_edge_security_probe tests.test_waf_security_probe
          python -m unittest tests.test_database_roles
          python -m unittest tests.test_azure_postgresql
          python -m unittest tests.test_azure_application tests.test_schema_migration tests.test_schema_runtime tests.test_codex_passthrough
          python -m unittest tests.test_runtime_secrets tests.test_backend_access
          python -m unittest tests.test_backend_manifest
          python -m unittest tests.test_optional_l3
          python -m unittest tests.test_model_sync tests.test_model_sync_evidence tests.test_model_configuration
          mkdir -p temp/model-sync-ci
          chmod 700 temp/model-sync-ci
          az bicep build --file infra/model-sync/main.bicep --outfile temp/model-sync-ci/main.json
          chmod 600 temp/model-sync-ci/main.json
          python -m unittest tests.test_proxy_config tests.test_entra_apps tests.test_admin_credentials
          python -m unittest tests.test_entra_access
          python -m unittest tests.test_entra_revoke tests.test_audit_governance tests.test_workflow_artifacts
          python -m unittest tests.test_admin_credential_lifecycle
          python -m unittest tests.test_proxy_credentials tests.test_proxy_credentials_runtime tests.test_proxy_manifest
          python -m scripts.validate_public_config
          python -m scripts.customer_migration --stage 0 --environment test --mode guide

  private-runtime-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1 service-identity==24.2.0 'psycopg[binary]==3.2.10' websocket-client==1.9.2
      - name: Verify isolated gateway TLS and PostgreSQL permissions
        env:
          RUN_PRIVATE_INGRESS_CONTAINER_TESTS: '1'
          RUN_DATABASE_ROLES_CONTAINER_TESTS: '1'
        run: |
          mkdir -p temp
          python -m unittest -b tests.test_private_ingress_container tests.test_database_roles_container
      - name: Verify API certificate protocol models without contacting a CA
        run: |
          python -m pip install acme==5.8.0 dnspython==2.8.0 josepy==2.2.0
          python -m unittest -b tests.test_certificate_runtime
      - name: Verify Azure credentials against locked LiteLLM Prisma
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=128m
          --env PYTHONDONTWRITEBYTECODE=1 --env LITELLM_LOCAL_MODEL_COST_MAP=True
          --env RUN_AZURE_PRISMA_CONTRACT_TESTS=1
          --mount "type=bind,src=$PWD,dst=/workspace,readonly" --workdir /workspace
          --entrypoint /app/.venv/bin/python
          docker.litellm.ai/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
          -m unittest -b tests.test_azure_postgresql tests.test_azure_postgresql_prisma
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix auth-proxy --ignore-scripts --no-fund
      - name: Verify native UI content read on isolated PostgreSQL
        env:
          RUN_AZURE_SCHEMA_CONTAINER_TESTS: '1'
          RUN_NATIVE_UI_BROWSER_TESTS: '1'
        run: python -m unittest -b tests.test_azure_schema_container
      - name: Build reviewed Azure application image
        run: docker build --network none -f LiteLLM/runtime/Dockerfile -t litellm-azure-runtime:ci .
      - name: Verify shipped callbacks inside the application image
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m
          --env RUN_RUNTIME_CALLBACK_TESTS=1
          --mount "type=bind,src=$PWD/tests,dst=/opt/llmgw-tests/tests,readonly" --workdir /opt/llmgw-tests
          --entrypoint /app/.venv/bin/python litellm-azure-runtime:ci
          -m unittest -b tests.test_codex_passthrough

  oss-callbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate callback envelope without LiteLLM dependencies
        run: python3 -m unittest tests.test_litellm_audit_envelope
      - name: Verify pinned OSS callbacks without external network
        run: bash scripts/validate-oss-callbacks.sh

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Ensure Bicep CLI
        run: az bicep install

      - name: Check customer parameter contracts against compiled templates
        run: python -m unittest tests.test_customer_templates

      - name: Validate Stage 3 assets
        env:
          PYTHON_BIN: python
          LITELLM_ACR_SUFFIX: stage3check
        run: bash scripts/validate-stage3.sh

      - name: Validate Stage 4 assets
        env:
          PYTHON_BIN: python
          LITELLM_ACR_SUFFIX: stage4check
        run: bash scripts/validate-stage4.sh

      - name: Validate Stage 5 assets
        env:
          PYTHON_BIN: python
          LITELLM_ACR_SUFFIX: stage5check
        run: bash scripts/validate-stage5.sh

      - name: Validate Stage 6 assets
        env:
          PYTHON_BIN: python
          LITELLM_ACR_SUFFIX: stage6check
        run: bash scripts/validate-stage6.sh

      - name: Check dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Set up Node for the OSS auth proxy
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: auth-proxy/package-lock.json

      - name: Install auth proxy dependencies
        run: npm ci --prefix auth-proxy --ignore-scripts --no-fund

      - name: Audit auth proxy dependencies
        run: npm audit --prefix auth-proxy --omit=dev --audit-level=high

      - name: Validate Stage 7 assets
        env:
          PYTHON_BIN: python
        run: bash scripts/validate-stage7.sh

      - name: Validate Stage 8 assets
        env:
          PYTHON_BIN: python
        run: bash scripts/validate-stage8.sh

      - name: Validate immutable collector configuration without network
        env:
          RUN_COLLECTOR_CONTAINER_TESTS: '1'
        run: python -m unittest -b tests.test_observability

      - name: Validate Stage 9 assets
        env:
          PYTHON_BIN: python
        run: bash scripts/validate-stage9.sh
