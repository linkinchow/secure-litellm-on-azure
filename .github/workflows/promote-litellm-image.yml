name: Promote LiteLLM image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected customer environment
        type: choice
        required: true
        default: test
        options: [dev, test, prod]
      acr_name:
        description: Target Premium ACR name
        required: true
        type: string
      source_image:
        description: Source image pinned by digest
        required: true
        default: docker.litellm.ai/berriai/litellm@sha256:6cc08e60be3e4ebf0cfb41ef23aed97e9ba4f61702d1e95e533f47ee6d67865f
        type: string
      target_tag:
        description: Target repository tag
        required: true
        default: litellm-azure:1.104.8
        type: string
      build_azure_runtime:
        description: Build the reviewed non-DDL Azure runtime image before promotion
        type: boolean
        default: true
      build_auth_proxy:
        description: Build the reviewed API/admin auth proxy image; cannot combine with build_azure_runtime
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: customer-change-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Require manual execution of the protected default branch
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_PROTECTED" == true ]] || exit 1
          [[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Use reviewed code on the protected default branch.' >&2; exit 1; }
  promote:
    needs: authorize
    runs-on: ${{ fromJSON(vars.MIGRATION_PRIVATE_RUNNER_LABELS) }}
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      WORKFLOW_ARTIFACT_KEY: ${{ secrets.WORKFLOW_ARTIFACT_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require digest-pinned source
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          ACR_NAME: ${{ inputs.acr_name }}
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          BUILD_AZURE_RUNTIME: ${{ inputs.build_azure_runtime }}
          BUILD_AUTH_PROXY: ${{ inputs.build_auth_proxy }}
        run: |
          [[ "$BUILD_AZURE_RUNTIME" != true || "$BUILD_AUTH_PROXY" != true ]] || { echo 'Choose only one runtime build.' >&2; exit 1; }
          [[ "$SOURCE_IMAGE" == *@sha256:* ]] || {
            echo 'Source image must be pinned by sha256 digest.' >&2
            exit 1
          }
          python3 -c 'import json,os; config=json.loads(os.environ["CUSTOMER_CONFIG_JSON"]); assert config["environment"] == os.environ["CUSTOMER_ENVIRONMENT"]; assert os.environ["ACR_NAME"] == config["parameters"]["platform"]["containerRegistryName"], "Target ACR differs from approved customer configuration"'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1
      - name: Check encrypted evidence and isolate registry credentials
        run: |
          python -m scripts.workflow_security check-key
          umask 077
          docker_config="$RUNNER_TEMP/llmgw-acr-$GITHUB_RUN_ID"
          mkdir -p "$docker_config" temp/image-promotion
          chmod 700 "$docker_config" temp/image-promotion
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Import image into ACR
        if: '!inputs.build_azure_runtime && !inputs.build_auth_proxy'
        env:
          ACR_NAME: ${{ inputs.acr_name }}
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: az acr import --name "$ACR_NAME" --source "$SOURCE_IMAGE" --image "$TARGET_TAG" --force

      - name: Sign in to ACR
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: az acr login --name "$ACR_NAME"

      - name: Build and push the reviewed Azure application runtime
        if: inputs.build_azure_runtime
        env:
          ACR_NAME: ${{ inputs.acr_name }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          [[ "$TARGET_TAG" =~ ^[a-z0-9][a-z0-9/._-]*:[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1
          docker build --network none -f LiteLLM/runtime/Dockerfile -t "$ACR_NAME.azurecr.io/$TARGET_TAG" .
          docker push "$ACR_NAME.azurecr.io/$TARGET_TAG"

      - name: Build and push the reviewed auth proxy
        if: inputs.build_auth_proxy
        env:
          ACR_NAME: ${{ inputs.acr_name }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          [[ "$TARGET_TAG" =~ ^[a-z0-9][a-z0-9/._-]*:[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1
          docker build -f auth-proxy/Dockerfile -t "$ACR_NAME.azurecr.io/$TARGET_TAG" auth-proxy
          docker push "$ACR_NAME.azurecr.io/$TARGET_TAG"

      - name: Resolve immutable target digest
        id: image
        env:
          ACR_NAME: ${{ inputs.acr_name }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          repository="${TARGET_TAG%%:*}"
          tag="${TARGET_TAG##*:}"
          digest="$(az acr manifest list-metadata --registry "$ACR_NAME" --name "$repository" --query "[?tags[?@=='$tag']].digest | [0]" -o tsv)"
          [[ "$digest" == sha256:* ]]
          echo "reference=${ACR_NAME}.azurecr.io/${repository}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Pull promoted image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: docker pull "$IMAGE_REFERENCE"

      - name: Generate SBOM
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: syft "$IMAGE_REFERENCE" --output spdx-json=temp/image-promotion/litellm-sbom.spdx.json

      - name: Block critical vulnerabilities
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_REFERENCE"

      - name: Sign promoted digest
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          BUILD_AZURE_RUNTIME: ${{ inputs.build_azure_runtime }}
          BUILD_AUTH_PROXY: ${{ inputs.build_auth_proxy }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$BUILD_AZURE_RUNTIME" == true ]]; then
            cosign sign --yes -a llmgw.runtime=azure -a "llmgw.revision=$GITHUB_SHA" -a "llmgw.environment=$CUSTOMER_ENVIRONMENT" "$IMAGE_REFERENCE"
          elif [[ "$BUILD_AUTH_PROXY" == true ]]; then
            cosign sign --yes -a llmgw.runtime=auth-proxy -a "llmgw.revision=$GITHUB_SHA" -a "llmgw.environment=$CUSTOMER_ENVIRONMENT" "$IMAGE_REFERENCE"
          else
            cosign sign --yes "$IMAGE_REFERENCE"
          fi

      - name: Verify promoted digest signature
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          BUILD_AZURE_RUNTIME: ${{ inputs.build_azure_runtime }}
          BUILD_AUTH_PROXY: ${{ inputs.build_auth_proxy }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/promote-litellm-image.yml@${GITHUB_REF}"
          annotations=()
          runtime=source
          if [[ "$BUILD_AZURE_RUNTIME" == true ]]; then
            runtime=azure
            annotations+=(-a llmgw.runtime=azure -a "llmgw.revision=$GITHUB_SHA" -a "llmgw.environment=$CUSTOMER_ENVIRONMENT")
          elif [[ "$BUILD_AUTH_PROXY" == true ]]; then
            runtime=auth-proxy
            annotations+=(-a llmgw.runtime=auth-proxy -a "llmgw.revision=$GITHUB_SHA" -a "llmgw.environment=$CUSTOMER_ENVIRONMENT")
          fi
          verification="$RUNNER_TEMP/target-image-verification-$GITHUB_RUN_ID.json"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${annotations[@]}" "$IMAGE_REFERENCE" > "$verification"
          mv "$verification" temp/image-promotion/target-image-verification.json
          export LLMGW_RUNTIME="$runtime"
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("temp/image-promotion")
          evidence = {}
          for name in ("litellm-sbom.spdx.json", "target-image-verification.json"):
              evidence[name] = hashlib.sha256((directory / name).read_bytes()).hexdigest()
          summary = {
              "schemaVersion": 1,
              "check": "target_image_signature_sbom",
              "runId": os.environ["GITHUB_RUN_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "revision": os.environ["GITHUB_SHA"],
              "environment": os.environ["CUSTOMER_ENVIRONMENT"],
              "image": os.environ["IMAGE_REFERENCE"],
              "runtime": os.environ["LLMGW_RUNTIME"],
              "signatureVerified": True,
              "vulnerabilityPolicy": {"severity": ["CRITICAL"], "ignoreUnfixed": True},
              "evidenceSha256": evidence,
              "observedAt": datetime.now(timezone.utc).isoformat(),
              "stageAccepted": False,
              "notCovered": ["Kubernetes deployment", "application authentication", "model inference", "stage acceptance"],
          }
          (directory / "target-image-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY

      - name: Encrypt image evidence
        if: success() || failure()
        env:
          ARTIFACT_NAME: litellm-sbom-${{ github.run_id }}
        run: >-
          python -m scripts.workflow_security seal --directory temp/image-promotion --name "$ARTIFACT_NAME"
          litellm-sbom.spdx.json target-image-verification.json target-image-summary.json
      - name: Upload encrypted SBOM evidence
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litellm-sbom-${{ github.run_id }}
          path: temp/image-promotion/sealed-artifact.json
          if-no-files-found: error
          retention-days: 30

      - name: Require manifest update through pull request
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          echo "Promoted immutable image: $IMAGE_REFERENCE"
          echo 'Update the target Kustomize overlay by pull request; this workflow does not deploy Kubernetes resources.'
      - name: Remove temporary registry credentials and plaintext SBOM
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/llmgw-acr-$GITHUB_RUN_ID" temp/image-promotion
