apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-api-proxy
  annotations:
    azure.workload.identity/client-id: REPLACE_API_PROXY_CLIENT_ID
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-admin-proxy
  annotations:
    azure.workload.identity/client-id: REPLACE_ADMIN_PROXY_CLIENT_ID
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-api-proxy
spec:
  replicas: 2
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: entra-auth-proxy
      plane: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entra-auth-proxy
        plane: api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: llm-api-proxy
      nodeSelector:
        workload: litellm
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-proxy
          image: REPLACE_APPROVED_ACR_AUTH_PROXY_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROXY_PLANE
              value: api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -c, "sleep 30"]
          volumeMounts:
            - name: config
              mountPath: /etc/auth-proxy
              readOnly: true
      volumes:
        - name: config
          configMap: {name: llm-auth-policy}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: entra-auth-proxy
              plane: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-api-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: entra-auth-proxy
      plane: api
---
apiVersion: v1
kind: Service
metadata:
  name: llm-api-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: entra-auth-proxy
    plane: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: llm-admin-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: entra-auth-proxy
    plane: admin
  ports:
    - name: http
      port: 8080
      targetPort: http