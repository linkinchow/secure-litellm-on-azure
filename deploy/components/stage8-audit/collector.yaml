apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  annotations:
    azure.workload.identity/client-id: REPLACE_TELEMETRY_CLIENT_ID
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: otel-collector}
  ports: [{name: otlp, port: 4318, targetPort: 4318}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: otel-collector
      nodeSelector:
        workload: litellm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: REPLACE_APPROVED_OTEL_CONTRIB_DIGEST
          args: ["--config=/etc/otel/collector-config.yaml"]
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: REPLACE_PROTECTED_APPINSIGHTS_CONNECTION_STRING
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          livenessProbe:
            httpGet: {path: /, port: 13133}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap: {name: otel-config}